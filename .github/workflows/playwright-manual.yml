name: Playwright - Handmatig

on:
  workflow_dispatch:
    inputs:
      shop:
        description: Welke shop wil je testen?
        required: true
        default: aluminiumvakman-nl
        type: choice
        options:
          - aluminiumvakman-nl
          - aluminiumexperte-de
          - houtvakman-nl

permissions:
  contents: read

concurrency:
  group: playwright-manual-${{ github.ref }}-${{ inputs.shop }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ inputs.shop }} smoke tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5

      - name: Node.js installeren
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: NPM dependencies installeren
        run: npm ci

      - name: TypeScript controleren
        run: npx tsc -p tsconfig.json --noEmit

      - name: Playwright browsers installeren
        run: npx playwright install --with-deps

      - name: Playwright-tests uitvoeren
        run: SHOP=${{ inputs.shop }} npx playwright test --project=chromium --workers=1

      - name: Playwright-rapport uploaden
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-manual-${{ inputs.shop }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30