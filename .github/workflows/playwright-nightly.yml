name: Playwright - Nachtelijk

on:
  workflow_dispatch:
  schedule:
    - cron: '6 12 * * *'
      timezone: 'Europe/Amsterdam'

permissions:
  contents: read

concurrency:
  group: lightspeed-production-smoke-tests-nightly
  cancel-in-progress: false

jobs:
  test:
    name: ${{ matrix.shop }} smoke tests
    timeout-minutes: 60
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shop:
          - aluminiumvakman-nl
          - aluminiumexperte-de
          - houtvakman-nl
          - houtvakman-be
          - eikenvakman-nl
          - eikenvakman-be
    
    concurrency:
      group: ${{ matrix.shop }}-production-smoke-tests
      cancel-in-progress: false

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5
      
      - name: Schedule debug info
        if: ${{ github.event_name == 'schedule' }}
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "event_schedule=${{ github.event.schedule }}"
          echo "UTC time:"
          date -u
          echo "Amsterdam time:"
          TZ=Europe/Amsterdam date

      - name: Node.js installeren
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: NPM dependencies installeren
        run: npm ci

      - name: TypeScript controleren
        run: npx tsc -p tsconfig.json --noEmit

      - name: Playwright browsers installeren
        run: npx playwright install --with-deps

      - name: Playwright-tests uitvoeren
        run: SHOP=${{ matrix.shop }} npx playwright test --workers=1

      - name: Grote Playwright-bestanden opruimen
        if: ${{ always() }}
        run: |
          find playwright-report -type f \( -name "*.webm" -o -name "*.png" -o -name "*.jpg" -o -name "error-context.md" \) -delete || true
          find test-results -type f \( -name "*.webm" -o -name "*.png" -o -name "*.jpg" -o -name "error-context.md" \) -delete || true

      - name: Playwright-rapport uploaden
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-nightly-${{ matrix.shop }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            !playwright-report/**/*.webm
            !playwright-report/**/*.png
            !playwright-report/**/*.jpg
            !playwright-report/**/error-context.md
            !test-results/**/*.webm
            !test-results/**/*.png
            !test-results/**/*.jpg
            !test-results/**/error-context.md
          retention-days: 7