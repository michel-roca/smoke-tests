name: Playwright - Handmatig

on:
  workflow_dispatch:
    inputs:
      shop:
        description: 'Welke shop wil je testen?'
          required: true
            default: 'aluminiumvakman-nl'
            type: choice
            options:
              - aluminiumvakman-nl
              - aluminiumexperte-de

          browser:
            description: 'Welke browser wil je gebruiken?'
            required: true
            default: 'chromium'
            type: choice
            options:
              - chromium
              - firefox
              - webkit
              - all

permissions:
  contents: read

concurrency:
  group: playwright-manual-${{ inputs.shop }}-${{ inputs.browser }}
  cancel-in-progress: false

jobs:
  test:
    name: ${{ inputs.shop }} - ${{ inputs.browser }}
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5

      - name: Node.js installeren
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: NPM dependencies installeren
        run: npm ci

      - name: TypeScript controleren
        run: npx tsc -p tsconfig.json --noEmit

      - name: Playwright browsers installeren
        run: npx playwright install --with-deps

      - name: Playwright-tests uitvoeren
        shell: bash
        run: |
          if [ "${{ inputs.browser }}" = "all" ]; then
            SHOP=${{ inputs.shop }} npx playwright test --workers=1
          else
            SHOP=${{ inputs.shop }} npx playwright test --project=${{ inputs.browser }} --workers=1
          fi

      - name: Playwright-rapport uploaden
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-manual-${{ inputs.shop }}-${{ inputs.browser }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 30